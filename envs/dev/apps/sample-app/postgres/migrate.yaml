apiVersion: batch/v1
kind: Job
metadata:
  name: sample-app-migrate
  labels:
    app.kubernetes.io/name: sample-app-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/reference-platform/sample-app-migrate:0.1.0
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sample-app-postgres
                  key: password
            - name: DATABASE_URL
              value: postgres://sample:$(DB_PASSWORD)@sample-app-postgres:5432/sample?sslmode=disable
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
