apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-alloy
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.15.0
      helm:
        releaseName: alloy
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/platform/alloy/values.yaml
          - $values/platform/alloy/dev/values.yaml
    - repoURL: https://github.com/reference-platform/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
