apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/reference-platform/gitops.git
      targetRevision: main
      path: platform/argocd/dev
      directory:
        include: '{root,projects,namespaces,appsets}.yaml'
    - repoURL: https://github.com/reference-platform/gitops.git
      targetRevision: main
      path: platform
      directory:
        recurse: true
        include: '*/dev/application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
