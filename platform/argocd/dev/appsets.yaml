apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/reference-platform/gitops.git
        revision: main
        files:
          - path: apps/*/dev/values.yaml
  template:
    metadata:
      name: 'dev-{{ index .path.segments 1 }}'
    spec:
      project: apps
      source:
        repoURL: https://github.com/reference-platform/gitops.git
        targetRevision: main
        path: charts/service
        helm:
          releaseName: '{{ index .path.segments 1 }}'
          ignoreMissingValueFiles: true
          valueFiles:
            - ../../apps/{{ index .path.segments 1 }}/values.yaml
            - ../../{{ .path.path }}/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: apps
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-manifests
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/reference-platform/gitops.git
        revision: main
        directories:
          - path: apps/*/manifests
  template:
    metadata:
      name: 'dev-{{ index .path.segments 1 }}'
    spec:
      project: apps
      source:
        repoURL: https://github.com/reference-platform/gitops.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: apps
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
