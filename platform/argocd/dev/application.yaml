apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-argocd
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.11.6
      helm:
        releaseName: argocd
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/platform/argocd/values.yaml
          - $values/platform/argocd/dev/values.yaml
    - repoURL: https://github.com/reference-platform/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # prune is off so a chart change cannot delete the running ArgoCD
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
