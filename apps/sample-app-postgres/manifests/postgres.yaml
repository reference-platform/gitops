apiVersion: v1
kind: Secret
metadata:
  name: sample-app-postgres
  labels:
    app.kubernetes.io/name: sample-app-postgres
stringData:
  password: sample
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app-postgres
  labels:
    app.kubernetes.io/name: sample-app-postgres
spec:
  selector:
    app.kubernetes.io/name: sample-app-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sample-app-postgres
  labels:
    app.kubernetes.io/name: sample-app-postgres
spec:
  serviceName: sample-app-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.6-trixie
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: sample
            - name: POSTGRES_DB
              value: sample
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sample-app-postgres
                  key: password
          readinessProbe:
            exec:
              command: [pg_isready, -U, sample, -d, sample]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, sample, -d, sample]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
